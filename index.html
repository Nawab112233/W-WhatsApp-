    /* =========================================================================
       AUDIO UTILITIES (Synthesized via Web Audio API - Zero External Files)
       ========================================================================= */
    let audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) audioCtx = new AudioContextClass();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playSentSound() {
      try {
        const ctx = getAudioCtx();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        const now = ctx.currentTime;
        osc.frequency.setValueAtTime(500, now);
        osc.frequency.exponentialRampToValueAtTime(1000, now + 0.08);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.09);
      } catch (e) {}
    }

    function playReceivedSound() {
      try {
        const ctx = getAudioCtx();
        if (!ctx) return;
        const now = ctx.currentTime;
        const osc1 = ctx.createOscillator();
        const gain1 = ctx.createGain();
        osc1.frequency.setValueAtTime(880, now);
        gain1.gain.setValueAtTime(0.15, now);
        gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
        osc1.connect(gain1);
        gain1.connect(ctx.destination);
        osc1.start(now);
        osc1.stop(now + 0.12);

        const osc2 = ctx.createOscillator();
        const gain2 = ctx.createGain();
        osc2.frequency.setValueAtTime(1318.5, now + 0.08);
        gain2.gain.setValueAtTime(0.18, now + 0.08);
        gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.28);
        osc2.connect(gain2);
        gain2.connect(ctx.destination);
        osc2.start(now + 0.08);
        osc2.stop(now + 0.3);
      } catch (e) {}
    }

    let ringInterval = null;
    function startRingtone() {
      stopRingtone();
      const burst = () => {
        try {
          const ctx = getAudioCtx();
          if (!ctx) return;
          const now = ctx.currentTime;
          [0, 0.4].forEach(off => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.frequency.setValueAtTime(440, now + off);
            gain.gain.setValueAtTime(0.1, now + off);
            gain.gain.exponentialRampToValueAtTime(0.001, now + off + 0.25);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + off);
            osc.stop(now + off + 0.26);
          });
        } catch (e) {}
      };
      burst();
      ringInterval = setInterval(burst, 2500);
    }
    function stopRingtone() {
      if (ringInterval) {
        clearInterval(ringInterval);
        ringInterval = null;
      }
    }

    function showToast(msg) {
      const el = document.getElementById('toast');
      const txt = document.getElementById('toast-text');
      if (el && txt) {
        txt.textContent = msg;
        el.classList.remove('hidden');
        setTimeout(() => el.classList.add('hidden'), 2200);
      }
    }

    /* =========================================================================
       RENDER ENGINE
       ========================================================================= */
    function render() {
      const root = document.getElementById('app');
      if (!root) return;

      if (STATE.currentScreen === 'admin') {
        root.innerHTML = renderAdmin();
      } else if (STATE.currentScreen === 'settings') {
        root.innerHTML = renderSettings();
      } else if (STATE.currentScreen === 'auth') {
        root.innerHTML = renderAuth();
      } else {
        root.innerHTML = renderMessenger();
      }

      lucide.createIcons();
    }

    /* =========================================================================
       ACTION HANDLERS
       ========================================================================= */
    function sendChatMessage() {
      const input = document.getElementById('chat-msg-input');
      if (!input || !input.value.trim()) return;

      const text = input.value.trim();
      input.value = '';

      playSentSound();

      const chat = STATE.chats.find(c => c.id === STATE.activeChatId);
      if (!chat) return;

      chat.messages.push({
        id: 'm_' + Date.now(),
        senderId: 'me',
        text: text,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        status: 'delivered',
        type: 'text'
      });
      render();

      // Auto Reply simulation
      setTimeout(() => {
        chat.typing = true;
        render();
      }, 700);

      setTimeout(() => {
        chat.typing = false;
        chat.messages.forEach(m => m.status = 'read');
        chat.messages.push({
          id: 'm_' + Date.now(),
          senderId: 'contact',
          text: 'Got your message! Looks super clean 👍',
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          status: 'read',
          type: 'text'
        });
        playReceivedSound();
        render();
      }, 2400);
    }

    function sendAttachment(type) {
      const chat = STATE.chats.find(c => c.id === STATE.activeChatId);
      if (!chat) return;
      playSentSound();
      if (type === 'image') {
        chat.messages.push({
          id: 'm_' + Date.now(),
          senderId: 'me',
          text: 'Design Inspiration 📸',
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          status: 'delivered',
          type: 'image',
          mediaUrl: 'https://images.unsplash.com/photo-1579783900882-c0d3dad7b119?w=800&auto=format&fit=crop&q=80'
        });
      } else {
        chat.messages.push({
          id: 'm_' + Date.now(),
          senderId: 'me',
          text: 'Feature demo preview video 🎬',
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          status: 'delivered',
          type: 'text'
        });
      }
      render();
    }

    function startCall(name, avatar, type) {
      startRingtone();
      alert(`W WhatsApp Call Connecting...\\n${name} (${type.toUpperCase()} Call)\\n\\n(End-to-End Encrypted Call Simulation)`);
      setTimeout(() => stopRingtone(), 3000);
    }

    function handleSettingClick(id) {
      if (id === 'privacy') {
        STATE.user.privacySettings.isPrivateAccount = !STATE.user.privacySettings.isPrivateAccount;
        showToast('Private Account is now: ' + (STATE.user.privacySettings.isPrivateAccount ? 'Enabled' : 'Disabled'));
        render();
      } else {
        showToast('Viewing ' + id + ' settings');
      }
    }

    function toggleBlockUser(id) {
      const u = STATE.adminUsers.find(x => x.id === id);
      if (!u) return;
      u.status = u.status === 'Active' ? 'Blocked' : 'Active';
      showToast(`${u.name} is now ${u.status}`);
      render();
    }

    function addNewAdminUser() {
      const name = prompt('Enter user name:');
      if (!name) return;
      STATE.adminUsers.unshift({
        id: 'u_' + Date.now(),
        name: name,
        avatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150&auto=format&fit=crop&q=80',
        phone: '+1 (555) 000-' + Math.floor(1000 + Math.random() * 9000),
        email: name.toLowerCase().replace(/\s+/g, '') + '@example.com',
        regDate: 'Today',
        status: 'Active',
        messagesCount: 0,
        location: 'New York, US'
      });
      showToast('Created user ' + name);
      render();
    }

    // Initialize application
    window.addEventListener('DOMContentLoaded', () => {
      render();
    });
  </script>
</body>
</html>
